<section class="section">
    <div class="wrap support">
      <div class="section-head">
        <h2>{{support.title}}</h2>
        <p class="lede">{{support.body}}</p>
        <a class="btn btn-ghost" href="https://github.com/Yiku21/kywai" rel="noopener">★ {{support.star}}</a>
      </div>
      <div class="give">
        <article>
          <span class="tag">{{support.onceTag}}</span>
          <h3>{{support.onceT}}</h3>
          <p>{{support.once}}</p>
          <a class="btn kofi" href="https://ko-fi.com/yilsander" rel="noopener">☕ {{support.kofi}}</a>
        </article>
        <article class="monthly">
          <span class="tag">{{support.monthlyTag}}</span>
          <h3>{{support.monthlyT}}</h3>
          <p>{{support.monthly}}</p>
          <a class="btn kofi" href="https://ko-fi.com/yilsander/tiers" rel="noopener">♥ {{support.member}}</a>
        </article>
      </div>
    </div>
  </section>
