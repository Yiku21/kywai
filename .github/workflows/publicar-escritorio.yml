# Publica kywai de escritorio en las Releases de este repositorio (el escaparate público Yiku21/kywai).
#
# El código de la app vive en un repositorio PRIVADO (Yiku21/kywai-original). Cada 10 minutos este flujo mira si su
# master tiene algo nuevo; si lo tiene:
#   1. Copia aquí lo que es público de verdad: la APK de Órbita (android/release), el MANUAL, docs/mods, la LICENSE y
#      los instaladores de una línea. Nada más del código entra en este repositorio.
#   2. Si cambió algo de la app (no solo Órbita o documentos), añade un commit vacío por cada título de commit nuevo
#      del código: así la ventana «Novedades» de las apps ya instaladas, que compara dos versiones de este
#      repositorio, sigue enseñando las mejoras.
#   3. Compila Windows, macOS y Linux desde el código privado y crea la Release v0.1.<commits del código>, con los
#      mismos nombres de archivo y los latest*.yml de siempre: las apps instaladas se actualizan solas igual que antes.
#
# Al ser un repositorio público, los minutos de GitHub Actions no cuestan nada. El código se baja con una llave de
# despliegue de SOLO LECTURA (secreto KYWAI_CODIGO_LLAVE). No hay disparador pull_request: nadie de fuera puede
# lanzar este flujo ni leer el secreto. No se imprime nada del código en los registros.
name: Publicar escritorio

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Publicar una versión aunque no haya cambios de la app'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar-escritorio
  cancel-in-progress: false

env:
  CODIGO_REPO: git@github.com:Yiku21/kywai-original.git
  CODIGO_RAMA: master

jobs:
  revisar:
    if: github.repository == 'Yiku21/kywai'
    runs-on: ubuntu-latest
    outputs:
      nueva: ${{ steps.mirar.outputs.nueva }}
      version: ${{ steps.mirar.outputs.version }}
      codigo: ${{ steps.mirar.outputs.codigo }}
      escaparate: ${{ steps.subir.outputs.escaparate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bajar el código privado (solo lectura)
        env:
          LLAVE: ${{ secrets.KYWAI_CODIGO_LLAVE }}
        run: |
          [ -n "$LLAVE" ] || { echo "::error::Falta el secreto KYWAI_CODIGO_LLAVE"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$LLAVE" > ~/.ssh/codigo && chmod 600 ~/.ssh/codigo
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND='ssh -i ~/.ssh/codigo -o IdentitiesOnly=yes' \
            git clone --quiet --branch "$CODIGO_RAMA" "$CODIGO_REPO" "$RUNNER_TEMP/codigo"
          rm -f ~/.ssh/codigo
      - id: mirar
        name: ¿Hay versión nueva?
        env:
          FORZAR: ${{ inputs.forzar }}
        run: |
          C="$RUNNER_TEMP/codigo"
          sha=$(git -C "$C" rev-parse HEAD)
          version="0.1.$(git -C "$C" rev-list --count HEAD)"
          antes=$(cat publicado/codigo.txt 2>/dev/null || true)
          echo "codigo=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          nueva=0
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "La versión v$version ya está publicada."
          elif [ "$FORZAR" = "true" ]; then
            nueva=1
          elif [ -n "$antes" ] && [ "$antes" != "$sha" ]; then
            # Lo mismo que paths-ignore del flujo antiguo: Órbita, documentos y textos no sacan versión de escritorio.
            if git -C "$C" diff --name-only "$antes" "$sha" \
                | grep -vE '^android/|^docs/|\.md$|^\.github/FUNDING\.yml$|^\.github/workflows/publicar-orbita\.yml$' | grep -q .; then
              nueva=1
            fi
          fi
          echo "nueva=$nueva" >> "$GITHUB_OUTPUT"
          echo "Código $sha, versión $version, nueva=$nueva"
      - name: Copiar lo público del código
        id: copiar
        run: |
          C="$RUNNER_TEMP/codigo"
          antes_inst=$(cat scripts/instalar-kywai.sh scripts/instalar-kywai.ps1 2>/dev/null | sha256sum)
          rm -rf android/release docs/mods
          mkdir -p android docs scripts
          cp -R "$C/android/release" android/release
          cp -R "$C/docs/mods" docs/mods
          cp "$C/docs/MANUAL.md" docs/MANUAL.md
          cp "$C/LICENSE" LICENSE
          cp "$C/scripts/instalar-kywai.sh" "$C/scripts/instalar-kywai.ps1" scripts/
          despues_inst=$(cat scripts/instalar-kywai.sh scripts/instalar-kywai.ps1 | sha256sum)
          [ "$antes_inst" = "$despues_inst" ] && echo "instaladores=0" >> "$GITHUB_OUTPUT" || echo "instaladores=1" >> "$GITHUB_OUTPUT"
      - id: subir
        name: Guardar en el escaparate
        env:
          NUEVA: ${{ steps.mirar.outputs.nueva }}
          SHA: ${{ steps.mirar.outputs.codigo }}
        run: |
          C="$RUNNER_TEMP/codigo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          antes=$(cat publicado/codigo.txt 2>/dev/null || true)
          git add android/release docs/MANUAL.md docs/mods LICENSE scripts/instalar-kywai.sh scripts/instalar-kywai.ps1
          git diff --cached --quiet || git commit --quiet -m '[skip] Sincroniza Órbita, manual, licencia e instaladores desde el código'
          if [ "$NUEVA" = "1" ]; then
            # Un commit vacío por cada mejora (solo el título, como ya sale en «Novedades»), del más viejo al más nuevo.
            if [ -n "$antes" ] && git -C "$C" cat-file -e "$antes^{commit}" 2>/dev/null; then
              git -C "$C" log --reverse --no-merges --format=%s "$antes..$SHA" | tail -n 200 > "$RUNNER_TEMP/titulos.txt"
            else
              : > "$RUNNER_TEMP/titulos.txt"
            fi
            while IFS= read -r titulo; do
              [ -n "$titulo" ] && git commit --quiet --allow-empty -m "$titulo"
            done < "$RUNNER_TEMP/titulos.txt"
          fi
          mkdir -p publicado
          if [ "$NUEVA" = "1" ] || [ -z "$antes" ]; then
            echo "$SHA" > publicado/codigo.txt
            git add publicado/codigo.txt
            git diff --cached --quiet || git commit --quiet -m '[skip] Código publicado'
          fi
          # Si alguien cambió la web mientras tanto, se pone encima de lo suyo antes de subir.
          for intento in 1 2 3; do
            git pull --quiet --rebase origin master && git push --quiet origin HEAD:master && break
            [ "$intento" = 3 ] && { echo "::error::No se pudo subir al escaparate"; exit 1; }
            sleep 5
          done
          echo "escaparate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Volver a publicar la web si cambiaron los instaladores
        if: steps.copiar.outputs.instaladores == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicar-web.yml --repo "$GITHUB_REPOSITORY" --ref master

  compilar:
    needs: revisar
    if: needs.revisar.outputs.nueva == '1'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac dmg zip --arm64 --x64 -c.mac.identity=- -c.mac.hardenedRuntime=false
          - os: ubuntu-latest
            args: --linux AppImage --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Bajar el código privado en el commit que se publica
        env:
          LLAVE: ${{ secrets.KYWAI_CODIGO_LLAVE }}
          SHA: ${{ needs.revisar.outputs.codigo }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$LLAVE" > ~/.ssh/codigo && chmod 600 ~/.ssh/codigo
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND='ssh -i ~/.ssh/codigo -o IdentitiesOnly=yes' git clone --quiet "$CODIGO_REPO" codigo
          git -C codigo checkout --quiet "$SHA"
          rm -f ~/.ssh/codigo
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: codigo/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: codigo
      - name: Compilar
        working-directory: codigo
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-vite build
          npx electron-builder ${{ matrix.args }} --publish never \
            -c.extraMetadata.version=${{ needs.revisar.outputs.version }} \
            -c.publish.provider=github -c.publish.owner=Yiku21 -c.publish.repo=kywai -c.publish.releaseType=release \
            '-c.nsis.artifactName=kywai-Setup-${version}.${ext}' \
            '-c.mac.artifactName=kywai-${version}-${arch}.${ext}' \
            '-c.linux.artifactName=kywai-${version}-${arch}.${ext}'
      - uses: actions/upload-artifact@v4
        with:
          name: escritorio-${{ matrix.os }}
          if-no-files-found: error
          path: |
            codigo/release/*.exe
            codigo/release/*.dmg
            codigo/release/*.zip
            codigo/release/*.AppImage
            codigo/release/*.blockmap
            codigo/release/latest*.yml

  publicar:
    needs: [revisar, compilar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisar.outputs.escaparate }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Añadir la APK de Órbita
        run: |
          if [ -s android/release/orbita.apk ]; then cp android/release/orbita.apk dist/kywai-orbita.apk
          else echo "::warning::No hay android/release/orbita.apk: la Release sale sin Órbita."; fi
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.revisar.outputs.version }}
          TARGET: ${{ needs.revisar.outputs.escaparate }}
        run: |
          ls -la dist
          cat > notas.md <<EOF
          Once installed, kywai checks for a newer version every time it opens.

          | System | Download |
          |---|---|
          | Windows 10/11 | \`kywai-Setup-${V}.exe\` |
          | macOS, Apple silicon (M1 and later) | \`kywai-${V}-arm64.dmg\` |
          | macOS, Intel | \`kywai-${V}-x64.dmg\` |
          | Linux x64 | \`kywai-${V}-x86_64.AppImage\` |
          | Linux ARM | \`kywai-${V}-arm64.AppImage\` |
          | Android (Órbita, the phone app) | \`kywai-orbita.apk\` |

          The apps are not code-signed yet:
          - **Windows:** if SmartScreen warns you, click "More info" → "Run anyway".
          - **macOS:** drag the app to Applications, then right-click it → Open (only the first time). If macOS says it is damaged, run \`xattr -cr "/Applications/kywai.app"\` in Terminal.
          - **Linux:** \`chmod +x kywai-*.AppImage\` and open it.
          - **Android:** open \`kywai-orbita.apk\` on the phone and allow installing apps from that source.

          You still need at least one AI agent (Claude Code, Codex CLI, Gemini CLI, a local model…). The setup assistant installs and signs in to them on first launch.
          EOF
          gh release create "v${V}" dist/* --repo "${GITHUB_REPOSITORY}" --target "${TARGET}" \
            --title "kywai ${V}" --notes-file notas.md --latest
